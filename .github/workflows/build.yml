name: Build Manette

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :android:app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Manette-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  wiiu:
    name: Wii U Aroma WPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WUPS image
        run: docker build -t manette-wiiu ./wiiu
      - name: Build WPS
        run: docker run --rm -v "$PWD/wiiu:/project" manette-wiiu make
      - uses: actions/upload-artifact@v4
        with:
          name: Manette-WiiU-WPS
          path: wiiu/Manette.wps
